version: v1.0
name: CKEditor build
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2404
auto_cancel:
  queued:
    when: "branch = 'master'"
blocks:
  - name: Build
    dependencies: []
    run:
      when: "branch = 'develop'"
    task:
      jobs:
        - name: Build
          commands:
            - checkout
            - sem-version node 20.6.1
            - npm ci
            - npm run build
  - name: Build & Publish
    dependencies: []
    run:
      when: "branch = 'master'"
    task:
      secrets:
        - name: npm-env-vars
      jobs:
        - name: Build & Publish
          commands:
            - checkout
            - sem-version node 20.6.1
            - npm ci
            - npm run build
            - npm config set '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
            - npm publish
